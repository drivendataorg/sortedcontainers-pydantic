[project]
name = "sortedcontainers-pydantic"
version = "2.1.0"
description = "Pydantic support for the sortedcontainers package."
readme = "README.md"
authors = [
  { name = "DrivenData", email = "info@drivendata.org" },
  { name = "Jay Qi", email = "jayqi.opensource@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["sorted", "sorteddict", "sortedlist", "sortedset", "pydantic"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Framework :: Pydantic",
  "Framework :: Pydantic :: 2",
]
requires-python = '>=3.10'
dependencies = ["pydantic>=2", "pydantic-core", "sortedcontainers"]

[project.urls]
"Homepage" = "https://github.com/drivendataorg/sortedcontainers-pydantic/"
"Repository" = "https://github.com/drivendataorg/sortedcontainers-pydantic"
"Bug Tracker" = "https://github.com/drivendataorg/sortedcontainers-pydantic/issues"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

## DEVELOPMENT ##

[dependency-groups]
dev = [
  { include-group = "lint" },
  "ipython",
  "reprexlite",
  { include-group = "vspect" },
]
lint = [
  "ruff",
]
tests = [
  "coverage",
  "pytest>6",
  "pytest-cov",
]
typecheck = [
  "mypy",
  "sortedcontainers-stubs",
]
vspect = [
  "vspect",
]

## TOOLS ##

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 99
src = ["src", "tests"]
exclude = ["example.py", "*.md"]

[tool.ruff.lint]
select = [
  "E", # Pyflakes
  "F", # Pycodestyle
  "I", # isort
]
unfixable = ["F"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.mypy]
files = ["src/sortedcontainers_pydantic", "tests/typechecks.py", "example.py"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=sortedcontainers_pydantic --cov-report=term --cov-report=html -v"
testpaths = ["tests"]

[tool.coverage.paths]
sortedcontainers_pydantic = [
  "src/sortedcontainers_pydantic/",
  "*/src/sortedcontainers_pydantic/",
  "*/site-packages/sortedcontainers_pydantic/",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
]
